<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Despacho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; }
    </style>
</head>
<body class="p-3">
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-warning fw-bold m-0">👨‍🍳 Pantalla de Despacho</h2>
        <div class="btn-group" role="group">
            <button class="btn btn-warning active" id="btn-TODOS" onclick="filtrar('TODOS')">📋 TODOS</button>
            <button class="btn btn-outline-warning" id="btn-BAR" onclick="filtrar('BAR')">🍹 BAR</button>
            <button class="btn btn-outline-warning" id="btn-COCINA" onclick="filtrar('COCINA')">🥟 COCINA</button>
            <button class="btn btn-outline-warning" id="btn-PARRILLA" onclick="filtrar('PARRILLA')">🥩 PARRILLA</button>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3" id="contenedor-pedidos">
        <!-- Tarjetas de pedidos dinámicas -->
    </div>
</div>

<script>
let filtroActual = 'TODOS';

function filtrar(estacion) {
    filtroActual = estacion;
    ['TODOS', 'BAR', 'COCINA', 'PARRILLA'].forEach(e => {
        let btn = document.getElementById('btn-' + e);
        if (btn) btn.className = (e === estacion) ? 'btn btn-warning active' : 'btn btn-outline-warning';
    });
    cargarPedidos();
}

function cargarPedidos() {
    fetch('/api/pedidos-pendientes/')
    .then(res => res.json())
    .then(data => {
        let contenedor = document.getElementById('contenedor-pedidos');
        contenedor.innerHTML = '';
        let vis = 0;

        data.pedidos.forEach(p => {
            let tieneBar = p.bar_items.length > 0;
            let tieneCocina = p.cocina_items.length > 0;
            let tieneParrilla = p.parrilla_items.length > 0;

            // Filtrado de visualización
            let mostrar = false;
            if (filtroActual === 'BAR' && tieneBar && !p.bar_entregado) mostrar = true;
            else if (filtroActual === 'COCINA' && tieneCocina && !p.cocina_entregado) mostrar = true;
            else if (filtroActual === 'PARRILLA' && tieneParrilla && !p.parrilla_entregado) mostrar = true;
            else if (filtroActual === 'TODOS' && !(p.bar_entregado && p.cocina_entregado && p.parrilla_entregado)) mostrar = true;

            if (!mostrar) return;
            vis++;

            // Renderizado de bloques con indicadores de estado
            let htmlBar = tieneBar ? `
                <div class="mb-2 p-2 rounded ${p.bar_entregado ? 'bg-success bg-gradient text-white opacity-75' : 'bg-dark border border-warning'}">
                    <div class="d-flex justify-content-between">
                        <small class="fw-bold ${p.bar_entregado ? 'text-white' : 'text-warning'}">🍹 BAR</small>
                        <small class="badge ${p.bar_entregado ? 'bg-light text-dark' : 'bg-danger'}">${p.bar_entregado ? '✔ LISTO' : 'PENDIENTE'}</small>
                    </div>
                    <div class="${p.bar_entregado ? 'text-decoration-line-through' : ''}">${p.bar_items.join('<br>')}</div>
                </div>` : '';

            let htmlCocina = tieneCocina ? `
                <div class="mb-2 p-2 rounded ${p.cocina_entregado ? 'bg-success bg-gradient text-white opacity-75' : 'bg-dark border border-warning'}">
                    <div class="d-flex justify-content-between">
                        <small class="fw-bold ${p.cocina_entregado ? 'text-white' : 'text-warning'}">🥟 COCINA</small>
                        <small class="badge ${p.cocina_entregado ? 'bg-light text-dark' : 'bg-danger'}">${p.cocina_entregado ? '✔ LISTO' : 'PENDIENTE'}</small>
                    </div>
                    <div class="${p.cocina_entregado ? 'text-decoration-line-through' : ''}">${p.cocina_items.join('<br>')}</div>
                </div>` : '';

            let htmlParrilla = tieneParrilla ? `
                <div class="mb-2 p-2 rounded ${p.parrilla_entregado ? 'bg-success bg-gradient text-white opacity-75' : 'bg-dark border border-warning'}">
                    <div class="d-flex justify-content-between">
                        <small class="fw-bold ${p.parrilla_entregado ? 'text-white' : 'text-warning'}">🥩 PARRILLA</small>
                        <small class="badge ${p.parrilla_entregado ? 'bg-light text-dark' : 'bg-danger'}">${p.parrilla_entregado ? '✔ LISTO' : 'PENDIENTE'}</small>
                    </div>
                    <div class="${p.parrilla_entregado ? 'text-decoration-line-through' : ''}">${p.parrilla_items.join('<br>')}</div>
                </div>` : '';

            // Botón de acción inteligente
            let botonAccion = '';
            if (filtroActual === 'BAR') {
                botonAccion = `<button class="btn btn-success btn-lg w-100 fw-bold" onclick="marcarEntregado(${p.id}, 'BAR')">🍹 ENTREGAR BAR</button>`;
            } else if (filtroActual === 'COCINA') {
                botonAccion = `<button class="btn btn-success btn-lg w-100 fw-bold" onclick="marcarEntregado(${p.id}, 'COCINA')">🥟 ENTREGAR COCINA</button>`;
            } else if (filtroActual === 'PARRILLA') {
                botonAccion = `<button class="btn btn-success btn-lg w-100 fw-bold" onclick="marcarEntregado(${p.id}, 'PARRILLA')">🥩 ENTREGAR PARRILLA</button>`;
            } else {
                botonAccion = `<button class="btn btn-outline-light btn-lg w-100 fw-bold" onclick="marcarEntregado(${p.id}, 'TODOS')">✔ ENTREGAR TODO EL PEDIDO</button>`;
            }

            contenedor.innerHTML += `
                <div class="col">
                    <div class="card border-warning bg-secondary text-white h-100 shadow">
                        <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                            <span class="fw-bold fs-4">#${p.id}</span>
                            <span class="badge bg-dark fs-6">${p.hora}</span>
                        </div>
                        <div class="card-body">
                            <h5 class="text-info fw-bold mb-1 text-center">${p.cliente}</h5>
                            <h3 class="fw-bold text-warning border-top border-bottom py-2 my-2 text-center">"${p.palabra_ticket}"</h3>
                            <div class="mt-2">
                                ${htmlBar}
                                ${htmlCocina}
                                ${htmlParrilla}
                            </div>
                        </div>
                        <div class="card-footer bg-transparent border-0 p-3">
                            ${botonAccion}
                        </div>
                    </div>
                </div>
            `;
        });

        if (vis === 0) {
            contenedor.innerHTML = '<div class="col-12 text-center text-muted fs-4 mt-5">Sin pedidos pendientes.</div>';
        }
    });
}
function marcarEntregado(id, estacion) {
    fetch(`/api/marcar-entregado/${id}/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estacion: estacion })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            cargarPedidos();
        } else {
            alert('Error: ' + data.message);
        }
    });
}

setInterval(cargarPedidos, 5000);
cargarPedidos();

function anularPedido(id) {
    if (confirm(`¿Estás seguro de anular el pedido #${id}?`)) {
        fetch(`/api/anular-venta/${id}/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'ok') {
                alert('Venta anulada correctamente');
                cargarPedidos(); // Refresca la lista de pedidos en cocina
            } else {
                alert('Error: ' + data.message);
            }
        });
    }
}
</script>
</body>
</html>
