<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja POS - Móvil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; }
        .btn-fast { font-size: 1.1rem; padding: 10px; }
        .card-prod { cursor: pointer; user-select: none; }
        .card-prod:active { transform: scale(0.96); }
        .btn-pago.active { background-color: #ffc107 !important; color: #000 !important; font-weight: bold; }
    </style>
</head>
<body class="p-2">

<div class="container-fluid p-0">
    <!-- CABECERA DE CANTIDADES RÁPIDAS (FIJA ARRIBA) -->
    <div class="bg-dark p-2 rounded mb-3 border border-warning shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="text-warning m-0 fw-bold">🛒 MENÚ</h4>
            <span class="badge bg-warning text-dark fs-6">Modo Rápido</span>
        </div>
        <div class="row g-1">
            <div class="col-6">
                <button type="button" class="btn btn-warning btn-fast w-100 fw-bold text-dark shadow" onclick="setMultiplicador(6)">
                    ⚡ MARCAR X 6
                </button>
            </div>
            <div class="col-6">
                <button type="button" class="btn btn-warning btn-fast w-100 fw-bold text-dark shadow" onclick="setMultiplicador(12)">
                    🔥 MARCAR X 12
                </button>
            </div>
        </div>
    </div>

    <div class="row g-2">
        <!-- CATÁLOGO DE PRODUCTOS -->
        <div class="col-12 col-md-7">
            <div class="row row-cols-2 g-2">
                {% for prod in productos %}
                <div class="col">
                    <div class="card card-prod bg-secondary text-white border-warning h-100 p-2 text-center shadow" 
                         onclick="seleccionarProducto('{{ prod.nombre|escapejs }}', {{ prod.precio }})">
                        <div class="fw-bold fs-5 text-warning leading-tight">{{ prod.nombre }}</div>
                        <div class="fs-4 fw-bold mt-1">${{ prod.precio }}</div>
                    </div>
                </div>
                {% empty %}
                <div class="col-12 text-center text-muted">No hay productos disponibles.</div>
                {% endfor %}
            </div>
        </div>

        <!-- RESUMEN DE VENTA Y CONFIRMACIÓN -->
        <div class="col-12 col-md-5 mt-3 mt-md-0">
            <div class="card bg-dark border-warning text-white p-3 shadow">
                <h4 class="text-warning mb-2 border-bottom border-secondary pb-2">📋 Detalle del Pedido</h4>
                
                <ul id="lista-pedido" class="list-group mb-2">
                    <li class="list-group-item bg-dark text-muted text-center py-3 border-secondary">Sin ítems seleccionados</li>
                </ul>

                <div class="d-flex justify-content-between align-items-center mb-2 fs-2 fw-bold text-warning border-top border-secondary pt-2">
                    <span>TOTAL:</span>
                    <span id="total-pagar">$0</span>
                </div>

                <div class="mb-2">
                    <input type="text" id="cliente" class="form-control form-control-lg bg-secondary text-white border-dark" placeholder="Cliente / Ref (Opcional)">
                </div>

                <!-- OPCIONES DE PAGO DE LADO A LADO -->
                <div class="mb-3">
                    <label class="form-label text-muted small mb-1">Método de Pago:</label>
                    <div class="btn-group w-100" role="group">
                        <button type="button" class="btn btn-outline-warning btn-pago active py-2" id="btn-efectivo" onclick="setMetodoPago('Efectivo')">💵 Efectivo</button>
                        <button type="button" class="btn btn-outline-warning btn-pago py-2" id="btn-maquina" onclick="setMetodoPago('Máquina')">💳 Máquina</button>
                        <button type="button" class="btn btn-outline-warning btn-pago py-2" id="btn-transf" onclick="setMetodoPago('Transferencia')">📲 Transf.</button>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-8">
                        <button type="button" class="btn btn-success btn-lg w-100 fw-bold fs-4 py-3" onclick="confirmarVenta()">✅ CONFIRMAR</button>
                    </div>
                    <div class="col-4">
                        <button type="button" class="btn btn-outline-danger btn-lg w-100 py-3" onclick="limpiarTodo()">🗑️</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
let pedido = {};
let multiplicadorModo = 1;
let metodoPagoSeleccionado = 'Efectivo';
const palabrasChilenas = ["Terremoto", "Guachaca", "Cachai", "Pisco", "Choripán", "Empanada", "Tikitiki", "Fonda"];

function setMetodoPago(metodo) {
    metodoPagoSeleccionado = metodo;
    document.getElementById('btn-efectivo').classList.remove('active');
    document.getElementById('btn-maquina').classList.remove('active');
    document.getElementById('btn-transf').classList.remove('active');

    if(metodo === 'Efectivo') document.getElementById('btn-efectivo').classList.add('active');
    if(metodo === 'Máquina') document.getElementById('btn-maquina').classList.add('active');
    if(metodo === 'Transferencia') document.getElementById('btn-transf').classList.add('active');
}

// Eliminamos el alert() para que el toque sea fluido
function setMultiplicador(cant) {
    multiplicadorModo = cant;
}

function seleccionarProducto(nombre, precio) {
    let cantAAgregar = multiplicadorModo;
    
    if (pedido[nombre]) {
        pedido[nombre].cantidad += cantAAgregar;
    } else {
        pedido[nombre] = { precio: precio, cantidad: cantAAgregar };
    }
    
    // Vuelve automáticamente a 1 para el siguiente toque
    multiplicadorModo = 1; 
    renderPedido();
}

function cambiarCantidad(nombre, delta) {
    if (pedido[nombre]) {
        pedido[nombre].cantidad += delta;
        if (pedido[nombre].cantidad <= 0) {
            delete pedido[nombre];
        }
    }
    renderPedido();
}

function renderPedido() {
    let lista = document.getElementById('lista-pedido');
    lista.innerHTML = '';
    let total = 0;

    let keys = Object.keys(pedido);
    if (keys.length === 0) {
        lista.innerHTML = '<li class="list-group-item bg-dark text-muted text-center py-3 border-secondary">Sin ítems seleccionados</li>';
        document.getElementById('total-pagar').innerText = '$0';
        return;
    }

    for (let prod in pedido) {
        let subtotal = pedido[prod].precio * pedido[prod].cantidad;
        total += subtotal;

        lista.innerHTML += `
            <li class="list-group-item bg-dark text-white d-flex justify-content-between align-items-center border-secondary py-2 px-2">
                <div class="me-2">
                    <strong class="fs-5 text-warning">${prod}</strong><br>
                    <small class="text-light fs-6">$${pedido[prod].precio.toLocaleString('es-CL')} x <strong>${pedido[prod].cantidad}</strong></small>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-danger px-3 fs-5" onclick="cambiarCantidad('${prod}', -1)">-</button>
                    <button type="button" class="btn btn-sm btn-success px-3 fs-5" onclick="cambiarCantidad('${prod}', 1)">+</button>
                </div>
            </li>
        `;
    }

    document.getElementById('total-pagar').innerText = '$' + total.toLocaleString('es-CL');
}

function limpiarTodo() {
    pedido = {};
    multiplicadorModo = 1;
    setMetodoPago('Efectivo');
    document.getElementById('cliente').value = '';
    renderPedido();
}

function confirmarVenta() {
    let keys = Object.keys(pedido);
    if (keys.length === 0) {
        alert("⚠️ Selecciona un producto primero.");
        return;
    }

    let totalCalculado = 0;
    let listaDetalle = [];
    for (let p in pedido) {
        totalCalculado += pedido[p].precio * pedido[p].cantidad;
        listaDetalle.push(`${pedido[p].cantidad}x ${p}`);
    }

    let palabraRandom = palabrasChilenas[Math.floor(Math.random() * palabrasChilenas.length)];
    let nombreCliente = document.getElementById('cliente').value.trim();

    let datosVenta = {
        cliente: nombreCliente,
        total: totalCalculado,
        metodo_pago: metodoPagoSeleccionado,
        palabra_ticket: palabraRandom,
        detalle_items: listaDetalle.join(', ')
    };

    fetch('/api/registrar-venta/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datosVenta)
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            alert(`✅ VENTA REGISTRADA (#${data.venta_id})\nTicket: "${palabraRandom}"\nPago: ${metodoPagoSeleccionado}\nTotal: $${totalCalculado.toLocaleString('es-CL')}`);
            limpiarTodo();
        } else {
            alert('❌ Error al registrar venta: ' + data.message);
        }
    })
    .catch(err => {
        console.error(err);
        alert('❌ Error de conexión al servidor.');
    });
}
</script>
