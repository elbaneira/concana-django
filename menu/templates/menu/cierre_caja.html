<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Caja - ConCaña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold fs-3">💰 Resumen de Cierre de Caja</span>
            <span id="fecha-actual" class="text-warning fw-bold fs-5"></span>
        </div>
    </nav>

    <div class="container py-3">
        
        <!-- Tarjeta Principal Total General -->
        <div class="card bg-success text-white shadow mb-4 text-center">
            <div class="card-body py-4">
                <h4 class="card-title text-uppercase fw-bold">TOTAL RECAUDADO HOY</h4>
                <h1 id="total-general" class="display-3 fw-bold my-2">$0</h1>
                <p id="cant-ventas" class="mb-0 fs-5">0 ventas realizadas</p>
            </div>
        </div>

        <!-- Desglose por Medios de Pago -->
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-4">
            
            <div class="col">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body text-center">
                        <div class="fs-1 mb-2">💵</div>
                        <h5 class="card-title text-muted fw-bold">EFECTIVO</h5>
                        <h2 id="total-efectivo" class="text-success fw-bold my-2">$0</h2>
                        <small class="text-muted">Dinero físico a cuadrar en caja</small>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body text-center">
                        <div class="fs-1 mb-2">💳</div>
                        <h5 class="card-title text-muted fw-bold">MÁQUINA / TARJETA</h5>
                        <h2 id="total-maquina" class="text-primary fw-bold my-2">$0</h2>
                        <small class="text-muted">Cobros voucher Transbank/Redelcom</small>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body text-center">
                        <div class="fs-1 mb-2">📲</div>
                        <h5 class="card-title text-muted fw-bold">TRANSFERENCIAS</h5>
                        <h2 id="total-transferencia" class="text-info fw-bold my-2">$0</h2>
                        <small class="text-muted">Transferencias a cuenta banco</small>
                    </div>
                </div>
            </div>

        </div>

        <!-- Información Adicional -->
        <div class="card border-0 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <span class="fw-bold text-muted">Ventas marcadas como Anuladas hoy:</span>
                <span id="cant-anuladas" class="badge bg-danger fs-6">0</span>
            </div>
        </div>

        <div class="text-center mt-4">
            <button onclick="cargarCierre()" class="btn btn-outline-dark fw-bold px-4">🔄 Actualizar Datos</button>
        </div>

    </div>

    <script>
        function formatoMoneda(valor) {
            return '$' + new Intl.NumberFormat('es-CL').format(valor);
        }

        function cargarCierre() {
            fetch('/api/cierre-caja/')
            .then(res => res.json())
            .then(data => {
                document.getElementById('fecha-actual').innerText = data.fecha;
                document.getElementById('total-general').innerText = formatoMoneda(data.total_general);
                document.getElementById('total-efectivo').innerText = formatoMoneda(data.total_efectivo);
                document.getElementById('total-maquina').innerText = formatoMoneda(data.total_maquina);
                document.getElementById('total-transferencia').innerText = formatoMoneda(data.total_transferencia);
                document.getElementById('cant-ventas').innerText = `${data.cantidad_ventas} ventas realizadas hoy`;
                document.getElementById('cant-anuladas').innerText = data.cantidad_anuladas;
            });
        }

        cargarCierre();
    </script>
</body>
</html>
